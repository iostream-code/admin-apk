<div id="absen-validasi-content" class="pb-10">

  <div class="px-3 pt-3 pb-2 flex items-center gap-2">
    <div class="search-input-wrap flex-1">
      <input id="av_search" type="text" placeholder="Cari Karyawan" class="search-input" />
      <svg class="search-icon w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.3-4.3" />
      </svg>
    </div>
    <select id="av_posisi" class="mat-input" style="width:auto;">
      <option value="all">Semua</option>
      <option value="produksi">Produksi</option>
      <option value="staff">Staff</option>
    </select>
    <button id="av_refresh" class="icon-btn flex-shrink-0" title="Muat Ulang">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="23 4 23 10 17 10" />
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
      </svg>
    </button>
  </div>

  <div class="px-3 pb-4">
    <div class="flex items-center justify-between mb-1.5 px-0.5">
      <p class="section-title text-sm">Data | <span class="section-count" id="av_count">0</span></p>
    </div>
    <div class="card-surface overflow-hidden">
      <div class="tbl-wrap">
        <table class="tbl-dark" style="min-width:760px;">
          <thead>
            <tr>
              <th class="td-center" style="width:32px;">No</th>
              <th class="td-center">Tanggal</th>
              <th class="td-left">Nama</th>
              <th class="td-center">Gaji</th>
              <th class="td-center">Lembur</th>
              <th class="td-center">Potongan</th>
              <th class="td-center">Tunjangan</th>
              <th class="td-center">Total</th>
              <th class="td-left">Opsi</th>
            </tr>
          </thead>
          <tbody id="av_table_body">
            <tr>
              <td colspan="9" class="tbl-empty">Memuat data...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- ===================== Popup Detail Presensi ===================== -->
  <div id="popup-detail-presensi"
    class="app-popup hidden fixed inset-0 z-[100] items-end sm:items-center justify-center bg-black/40">
    <div class="app-overlay-panel bg-white w-full sm:max-w-lg sm:rounded-lg rounded-t-lg h-[92vh] overflow-y-auto">
      <div class="flex items-center justify-between px-4 py-3 border-b border-ink-faint sticky top-0 bg-white z-10">
        <div class="font-bold text-ink-primary text-sm">Detail Gaji <span id="dp_nama"></span></div>
        <button class="popup-close text-ink-secondary text-xl leading-none">&times;</button>
      </div>
      <div id="dp_body" class="p-3 space-y-3"></div>
    </div>
  </div>

</div>
