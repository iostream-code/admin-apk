<div id="sj-list-content" class="pb-10">

  <div class="px-3 pt-3 pb-2 flex items-center gap-2">
    <div class="search-input-wrap flex-1">
      <input id="sj_search" type="text" placeholder="Cari No SJ / Klien" class="search-input" />
      <svg class="search-icon w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.3-4.3" />
      </svg>
    </div>
    <select id="sj_tahun" class="mat-input" style="width:auto;"></select>
  </div>

  <div class="px-3 pb-2 flex items-center justify-between gap-2">
    <p class="section-title text-sm">Data | <span class="section-count text-sm" id="sj_count">0</span></p>
    <div class="flex items-center gap-1.5 flex-shrink-0">
      <button id="sj_add" class="icon-btn icon-btn--primary w-8 h-8 flex-shrink-0" title="Buat SJ">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
      </button>
      <button id="sj_toggle_riwayat" class="icon-btn w-8 h-8 flex-shrink-0" title="Riwayat">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10" />
          <polyline points="12 6 12 12 16 14" />
        </svg>
      </button>
      <button id="sj_refresh" class="icon-btn w-8 h-8 flex-shrink-0" title="Muat Ulang">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10" />
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10" />
        </svg>
      </button>
    </div>
  </div>

  <div class="px-3 pb-4">
    <div class="card-surface overflow-hidden">
      <div class="tbl-wrap">
        <table class="tbl-dark" style="min-width:560px;">
          <thead>
            <tr id="sj_thead_row">
              <th class="td-left">No SJ</th>
              <th class="td-left">Klien</th>
              <th class="td-center">Dikirim</th>
              <th class="td-left">Keterangan</th>
              <th class="td-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="sj_table_body">
            <tr>
              <td colspan="5" class="tbl-empty">Memuat data...</td>
            </tr>
          </tbody>
        </table>
      </div>
      <div id="sj_pagination" class="flex items-center justify-center gap-3 border-t border-ink-faint py-2"></div>
    </div>
  </div>

  <!-- Popup: Tidak Ada Akses (akun ini bukan admin Ekspedisi, lihat ekspedisiAuth.js) -->
  <div id="popup-sj-no-access"
    class="app-popup hidden fixed inset-0 z-[100] items-end sm:items-center justify-center bg-black/40">
    <div class="app-overlay-panel bg-white w-full sm:max-w-sm sm:rounded-lg rounded-t-lg overflow-y-auto">
      <div class="p-5 text-center">
        <p class="font-bold text-ink-primary text-sm mb-1">Tidak Ada Akses</p>
        <p class="text-xs text-ink-secondary mb-4">Akun Anda tidak terdaftar sebagai admin Ekspedisi, jadi tidak bisa
          membuka menu SJ. Hubungi admin sistem kalau ini seharusnya tidak terjadi.</p>
        <button class="popup-close btn-action btn-action--primary">Tutup</button>
      </div>
    </div>
  </div>

  <!-- Popup Detail Surat Jalan -->
  <div id="popup-sj-detail"
    class="app-popup hidden fixed inset-0 z-[100] items-end sm:items-center justify-center bg-black/40">
    <div class="app-overlay-panel bg-white w-full sm:max-w-md sm:rounded-lg rounded-t-lg h-[92vh] overflow-y-auto">
      <div class="flex items-center justify-between px-4 py-3 border-b border-ink-faint sticky top-0 bg-white z-10">
        <div class="font-bold text-ink-primary text-sm">Detail Surat Jalan</div>
        <button class="popup-close text-ink-secondary text-xl leading-none">&times;</button>
      </div>
      <div id="sjd_body" class="p-3 space-y-3 text-sm"></div>
    </div>
  </div>

</div>
