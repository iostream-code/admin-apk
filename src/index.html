<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, minimal-ui, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src * gap: 'unsafe-inline' 'unsafe-eval' data: blob:;" />
  <title>Admin</title>
</head>

<body>
  <!-- cordova.js disuntik otomatis oleh Cordova CLI saat `cordova prepare`, jangan dihapus -->
  <script src="cordova.js"></script>

  <!-- Shell aplikasi -- persis pola inventory-apk (2026-08-26, permintaan user
       "harusnya seperti tab saja, posisinya langsung dibawah menu utama"):
       #app-navbar = navbar atas (jam, status internet, nama pegawai, logout),
       #app-tabs = tab menu TETAP (Point/Absen/Finance + sub-tab Sales/Produksi
       atau Payment/Payable, lihat lib/shell.js), #app-page = kontainer halaman
       aktif (di-render oleh router). Beda dari versi sebelumnya (submenu
       sbg halaman tersendiri yg dinavigasi+ada tombol "Kembali") -- sekarang
       ganti section TIDAK pindah halaman/hub, cuma ganti tab, sama spt
       Stock/PO/Partner/Logo di inventory-apk. -->
  <div id="app">
    <header id="app-navbar" class="hidden"></header>
    <nav id="app-tabs" class="hidden"></nav>
    <main id="app-page"></main>
  </div>
  <div id="app-overlays"></div>

  <script type="module" src="./main.js"></script>
</body>

</html>
